<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --danger: #f85149;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 20px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.up { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.down { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  .config { margin-bottom: 20px; }
  .config input {
    width: 100%; padding: 9px 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: var(--mono); font-size: 12px;
  }

  .add-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .add-row input {
    flex: 1; padding: 10px 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 14px;
  }
  .add-row button {
    padding: 10px 18px; background: var(--accent); border: none;
    border-radius: 6px; color: #04240f; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  .add-row button:hover { opacity: 0.9; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .task {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .task input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .task-title { flex: 1; font-size: 14px; }
  .task-title.done { color: var(--muted); text-decoration: line-through; }
  .task-id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .del-btn {
    background: none; border: 1px solid var(--border); color: var(--danger);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  .del-btn:hover { background: rgba(248,81,73,0.1); }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
  .error { color: var(--danger); font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Task manager</h1>
    <div class="status"><span class="dot" id="healthDot"></span><span id="healthText">checking...</span></div>
  </header>

  <div class="config">
    <input id="apiBase" type="text" value="http://localhost:5000" onchange="init()">
  </div>

  <div class="add-row">
    <input id="newTitle" type="text" placeholder="New task title" onkeydown="if(event.key==='Enter') addTask()">
    <button onclick="addTask()">Add</button>
  </div>

  <div id="errorBox"></div>
  <div class="list" id="taskList"></div>
</div>

<script>
function apiBase() {
  return document.getElementById("apiBase").value.replace(/\/$/, "");
}

function showError(msg) {
  const box = document.getElementById("errorBox");
  box.innerHTML = msg ? `<div class="error">${msg}</div>` : "";
}

async function checkHealth() {
  const dot = document.getElementById("healthDot");
  const text = document.getElementById("healthText");
  try {
    const res = await fetch(apiBase() + "/health");
    if (res.ok) {
      dot.className = "dot up";
      text.textContent = "backend healthy";
    } else {
      dot.className = "dot down";
      text.textContent = "backend error";
    }
  } catch (e) {
    dot.className = "dot down";
    text.textContent = "backend unreachable";
  }
}

async function loadTasks() {
  try {
    const res = await fetch(apiBase() + "/tasks");
    if (!res.ok) throw new Error("Failed to load tasks");
    const tasks = await res.json();
    renderTasks(tasks);
    showError(null);
  } catch (e) {
    document.getElementById("taskList").innerHTML = "";
    showError("Could not load tasks — check the backend URL above and that Flask is running.");
  }
}

function renderTasks(tasks) {
  const list = document.getElementById("taskList");
  if (!tasks.length) {
    list.innerHTML = `<div class="empty">No tasks yet. Add one above.</div>`;
    return;
  }
  list.innerHTML = tasks.map(t => `
    <div class="task">
      <input type="checkbox" ${t.completed ? "checked" : ""} onchange="toggleTask(${t.id}, this.checked)">
      <div class="task-title ${t.completed ? "done" : ""}">${escapeHtml(t.title)}</div>
      <div class="task-id">#${t.id}</div>
      <button class="del-btn" onclick="deleteTask(${t.id})">Delete</button>
    </div>
  `).join("");
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

async function addTask() {
  const input = document.getElementById("newTitle");
  const title = input.value.trim();
  if (!title) return;
  try {
    const res = await fetch(apiBase() + "/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Could not add task");
    }
    input.value = "";
    showError(null);
    loadTasks();
  } catch (e) {
    showError(e.message);
  }
}

async function toggleTask(id, completed) {
  try {
    const res = await fetch(apiBase() + "/tasks/" + id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ completed })
    });
    if (!res.ok) throw new Error("Could not update task");
    loadTasks();
  } catch (e) {
    showError(e.message);
  }
}

async function deleteTask(id) {
  try {
    const res = await fetch(apiBase() + "/tasks/" + id, { method: "DELETE" });
    if (!res.ok) throw new Error("Could not delete task");
    loadTasks();
  } catch (e) {
    showError(e.message);
  }
}

function init() {
  checkHealth();
  loadTasks();
}

init();
</script>
</body>
</html>
